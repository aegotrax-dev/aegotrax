[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegotrax"
version = "0.2.5"
description = "Runtime security gateway for AI agents (MCP + Python SDK)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aegotrax" }]
keywords = ["ai", "agents", "security", "mcp", "gateway", "firewall", "pilot"]
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn>=0.20.0",
  "pydantic>=2.0.0",
  "mcp>=1.0.0",
  "requests>=2.28.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
demo = [
  "langchain-openai>=0.1.0",
  "langgraph>=0.2.0",
  "langchain-mcp-adapters>=0.1.0",
]

[project.scripts]
aegotrax-engine = "aegotrax.risk_engine:main"
aegotrax-gateway = "aegotrax.mcp_gateway:main"

[project.urls]
Homepage = "https://aegotrax.com"
Repository = "https://github.com/aegotrax-dev/aegotrax"
Documentation = "https://github.com/aegotrax-dev/aegotrax#readme"
"Bug Tracker" = "https://github.com/aegotrax-dev/aegotrax/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegotrax*"]

[tool.setuptools.package-data]
aegotrax = ["policy.yaml"]
