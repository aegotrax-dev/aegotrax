# AgentGuard Security Policy (hardened pilot)
# Override with AGENTGUARD_POLICY_PATH or place policy.yaml in CWD.

risk_thresholds:
  block: 70
  require_approval: 50

# Email recipient domains (use @prefix or bare domain; matched exactly / subdomain)
trusted_domains:
  - "@company.com"
  - "company.com"

# Full endpoint URLs (legacy) — host is extracted for allowlist checks
trusted_endpoints:
  - "https://api.internal-analytics.com/log"

# Preferred: bare hostnames for outbound HTTP allowlist (exact or subdomain)
trusted_hosts:
  - "api.internal-analytics.com"

sensitive_tools:
  - "list_users"
  - "read_document"
  - "read_db"
  - "query_customers"
  - "get_ssn"
  - "export_records"

outbound_tools:
  - "http_post"
  - "send_email"
  - "http_request"
  - "webhook"
  - "email"

dangerous_script_keywords:
  - "wipe"
  - "delete"
  - "rm"
  - "logs"
  - "privilege"
  - "drop table"
  - "truncate"
  - "shred"
  - "unlink"
  - "remove"
  - "format"
  - "mkfs"
  - "dd if="

sensitive_payload_keywords:
  read_db:
    - "customer"
    - "db_record"
    - "sql"
    - "confidential"
    - "pii"
  list_users:
    - "user_list"
    - "email_list"
    - "ssn"
    - "list_users"
  read_document:
    - "doc_content"
    - "confidential"
    - "read_document"
    - "financial"
  query_customers:
    - "customer"
    - "pii"
    - "ssn"
  get_ssn:
    - "ssn"
    - "social"
  export_records:
    - "export"
    - "records"
    - "csv"

always_block_tools: []
always_require_approval_tools: []

# Cumulative read budgets per session (0.2.5)
# Count calls to sensitive_tools; exceed → REQUIRE_APPROVAL or BLOCK
read_budgets:
  default_max_calls: 20
  on_exceed: REQUIRE_APPROVAL  # or BLOCK
  tools:
    read_db:
      max_calls: 10
    read_document:
      max_calls: 15

