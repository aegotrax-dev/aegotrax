services:
  aegotrax-engine:
    build: .
    container_name: aegotrax-engine
    ports:
      # Local sandbox only — do not publish to the internet
      - "127.0.0.1:8000:8000"
    environment:
      # Listen inside the container; host access is localhost-only via ports above
      AEGOTRAX_HOST: "0.0.0.0"
      AEGOTRAX_PORT: "8000"
      AEGOTRAX_AUDIT_LOG: "/data/aegotrax_audit.log"
      AEGOTRAX_POLICY_PATH: "/data/policy.yaml"
      # Recommended for any shared machine:
      # AEGOTRAX_API_KEY: "replace-with-long-random-string"
      # Optional audit stream (public HTTPS only; loopback/private targets rejected):
      # AEGOTRAX_AUDIT_WEBHOOK: "https://your-endpoint.example/audit"
    volumes:
      - ./data:/data
    restart: unless-stopped
