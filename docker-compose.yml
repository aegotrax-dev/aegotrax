services:
  aegotrax-engine:
    build: .
    container_name: aegotrax-engine
    ports:
      # Local sandbox only — do not publish to the internet
      - "127.0.0.1:8000:8000"
    environment:
      # Listen inside the container; host access is localhost-only via ports above
      AEGOTRAX_HOST: "0.0.0.0"
      AEGOTRAX_PORT: "8000"
      AEGOTRAX_AUDIT_LOG: "/data/aegotrax_audit.log"
      AEGOTRAX_POLICY_PATH: "/data/policy.yaml"
      # Required (secure by default). Export it in your shell or put it in an untracked .env.
      # `:?` makes `docker compose up` fail immediately if it is missing.
      AEGOTRAX_API_KEY: ${AEGOTRAX_API_KEY:?set AEGOTRAX_API_KEY}
      # Human approvers use their OWN credential (must differ from AEGOTRAX_API_KEY).
      # Leave empty to run without approvals: REQUIRE_APPROVAL then stays blocked.
      # Several approvers: AEGOTRAX_APPROVER_KEYS="alice:key-a,bob:key-b"
      AEGOTRAX_APPROVER_KEY: ${AEGOTRAX_APPROVER_KEY:-}
      # enforce (default) | shadow = log what would be blocked, never block
      AEGOTRAX_ENFORCEMENT: ${AEGOTRAX_ENFORCEMENT:-enforce}
      # Optional audit stream (public HTTPS only; loopback/private targets rejected):
      # AEGOTRAX_AUDIT_WEBHOOK: "https://your-endpoint.example/audit"
    volumes:
      - ./data:/data
    restart: unless-stopped
