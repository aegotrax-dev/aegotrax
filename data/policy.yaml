# Aegotrax Security Policy (0.2.8)
# Override with AEGOTRAX_POLICY_PATH or place policy.yaml in CWD.

risk_thresholds:
  block: 70
  require_approval: 50

# What an email to a recipient outside trusted_domains does by itself (0.2.8):
#   REQUIRE_APPROVAL (default) — a human approver decides
#   BLOCK                      — hard stop (the pre-0.2.8 behaviour)
# After a sensitive read, sending outside trusted domains is still blocked either way.
email_untrusted_recipient: REQUIRE_APPROVAL

trusted_domains:
  - "@company.com"
  - "company.com"

trusted_endpoints:
  - "https://api.internal-analytics.com/log"

trusted_hosts:
  - "api.internal-analytics.com"

sensitive_tools:
  - "list_users"
  - "read_document"
  - "read_db"
  - "query_customers"
  - "get_ssn"
  - "export_records"

outbound_tools:
  - "http_post"
  - "send_email"
  - "http_request"
  - "webhook"
  - "email"

# Tool risk direction at registration (0.2.6). Unclassified → open_risk (fail-closed).
tool_classes:
  default: open_risk
  reduce_risk:
    - "read_document"
    - "read_db"
    - "list_users"
    - "query_customers"
    - "get_ssn"
    - "export_records"
    - "close_position"
    - "pause_trading"
  open_risk:
    - "http_post"
    - "send_email"
    - "http_request"
    - "webhook"
    - "email"
    - "execute_code"
    - "run_shell"
    - "delete_user"
  # open_risk tools elevate to REQUIRE_APPROVAL unless already blocked
  open_risk_min_decision: REQUIRE_APPROVAL

# Tools that run code or commands (0.2.8). The dangerous_script_keywords check and the
# intent heuristic apply to exactly these names, so keep it in line with tool_classes.
code_execution_tools:
  - "execute_script"
  - "run_code"
  - "shell"
  - "execute_code"
  - "run_shell"

# Keywords of 3 characters or fewer ("rm") match whole tokens only; longer ones match as
# substrings (so "wipe" still catches "wipe_logs.sh").
dangerous_script_keywords:
  - "wipe"
  - "delete"
  - "rm"
  - "rmdir"
  - "rmtree"
  - "logs"
  - "privilege"
  - "drop table"
  - "truncate"
  - "shred"
  - "unlink"
  - "remove"
  - "format c:"
  - "mkfs"
  - "dd if="

sensitive_payload_keywords:
  read_db:
    - "customer"
    - "db_record"
    - "sql"
    - "confidential"
    - "pii"
  list_users:
    - "user_list"
    - "email_list"
    - "ssn"
    - "list_users"
  read_document:
    - "doc_content"
    - "confidential"
    - "read_document"
    - "financial"
  query_customers:
    - "customer"
    - "pii"
    - "ssn"
  get_ssn:
    - "ssn"
    - "social"
  export_records:
    - "export"
    - "records"
    - "csv"

always_block_tools: []
always_require_approval_tools: []

# Cumulative read budgets (0.2.5+)
read_budgets:
  default_max_calls: 20
  on_exceed: REQUIRE_APPROVAL
  # 0.2.6: close session after budget exceed so further calls BLOCK
  end_session_on_exceed: true
  tools:
    read_db:
      max_calls: 10
    read_document:
      max_calls: 15

# Session sensitivity ceiling (0.2.6) — monotonic tag; outbound gated on ceiling
sensitivity_ceiling:
  enabled: true
  # raise session ceiling when these tools are invoked (reads)
  raise_on_tools: []  # empty → use sensitive_tools
  raise_to: 1
  # outbound tools when ceiling >= min → decision below
  outbound_min_ceiling: 1
  on_outbound: REQUIRE_APPROVAL
