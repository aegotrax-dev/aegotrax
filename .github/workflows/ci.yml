# Tests + benchmark regression gate. Runs on every push to main/dev and on pull requests.
# Actions are SHA-pinned like the other workflows (the plugin scanner flags unpinned ones).
# Python comes from the runner image (ubuntu-24.04 ships 3.12), so no second action is needed.
name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install
        run: |
          python3 --version
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[test]"

      - name: Unit tests
        run: |
          . .venv/bin/activate
          python -m pytest -q

      - name: Offline security checks
        run: |
          . .venv/bin/activate
          AEGOTRAX_API_KEY=ci-only-key python examples/security_hardening_test.py

      - name: Benchmark (in-process)
        run: |
          . .venv/bin/activate
          python benchmark/run_benchmark.py --in-process --out "$RUNNER_TEMP/bench.json" --note "CI run"

      - name: Benchmark gate
        run: |
          . .venv/bin/activate
          python benchmark/check_gate.py "$RUNNER_TEMP/bench.json"
